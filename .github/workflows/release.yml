name: Build Blender Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Blender extension ZIP
        shell: pwsh
        run: tools/build_release.ps1

      - name: Upload Blender artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutaform_bridge_blender
          path: dist/mutaform_bridge_blender.zip

      - name: Upload Maya artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutaform_bridge_maya
          path: downloads/mutaform_bridge_maya_v1.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mutaform_bridge_blender.zip
            downloads/mutaform_bridge_maya_v1.zip

name: Publish QC Bridge Maya-Blender

# Builds both halves and publishes them to GitHub Pages: the Blender extension
# repository (index.json + zip, generated by Blender itself) and the Maya
# companion (zip + version.json, the update manifest the installed tool reads).
#
# The Maya manifest is generated by the same script that builds the zip, never
# by hand: a manifest whose version disagrees with the archive beside it
# advertises an update that installs nothing and is then offered forever.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mutaform_bridge/**"
      - "maya/**"
      - "tools/**"
      - "tests/**"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build release archives and manifest
        shell: pwsh
        run: |
          # Lower-cased deliberately. github.repository_owner keeps the
          # account's own capitalisation, and while a Pages host is
          # case-insensitive, the URL it produces would not match the one the
          # installed tool has as its default - a difference that is invisible
          # until something compares the two as strings.
          $owner = "${{ github.repository_owner }}".ToLowerInvariant()
          $name  = "${{ github.event.repository.name }}".ToLowerInvariant()
          $env:QCBRIDGE_PAGES_URL = "https://$owner.github.io/$name"
          Write-Host "publishing as $env:QCBRIDGE_PAGES_URL"
          tools/build_release.ps1

      # The updater imports nothing from Maya, so it is tested on every
      # publish - against the archive and manifest this very build produced.
      - name: Test the updater against the built archive
        shell: pwsh
        run: python tests/test_updater.py

      - name: Check Blender ZIP contents
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath pages/mutaform_bridge_blender.zip -DestinationPath verify -Force
          if (-not (Test-Path -LiteralPath "verify/blender_manifest.toml")) {
            throw "Invalid extension ZIP: missing blender_manifest.toml"
          }

      - name: Download Blender
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.blender.org/release/Blender4.5/blender-4.5.0-windows-x64.zip" -OutFile blender.zip
          Expand-Archive -LiteralPath blender.zip -DestinationPath blender -Force

      - name: Generate Blender extension repository index
        shell: pwsh
        run: |
          # Blender indexes every zip in the folder it is given, so it gets a
          # folder holding only the extension; the Maya archive beside it in
          # pages/ is not an extension and must not confuse it.
          New-Item -ItemType Directory -Force -Path repo_blender | Out-Null
          Copy-Item -LiteralPath pages/mutaform_bridge_blender.zip -Destination repo_blender/mutaform_bridge_blender.zip -Force

          $blender = Get-ChildItem -Path blender -Recurse -Filter blender.exe | Select-Object -First 1
          & $blender.FullName --command extension server-generate --repo-dir repo_blender

          $index = Get-Content -LiteralPath repo_blender/index.json -Raw
          if ($index -match '"data"\s*:\s*\[\s*\]') {
            throw "Generated index.json is empty. Blender did not recognize the extension ZIP."
          }
          Copy-Item -LiteralPath repo_blender/index.json -Destination pages/index.json -Force

      - name: Show what will be published
        shell: pwsh
        run: |
          Get-ChildItem pages
          Get-Content pages/version.json

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages
          publish_branch: gh-pages
          force_orphan: true
